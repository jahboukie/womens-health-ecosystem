name: Web Apps CI/CD

on:
  push:
    paths:
      - 'web/**'
      - 'shared/**'
  pull_request:
    paths:
      - 'web/**'
      - 'shared/**'

jobs:
  web-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/soberpal-web/package-lock.json
          
      - name: Install dependencies
        run: |
          cd web/soberpal-web
          npm ci
          
      - name: Run tests
        run: |
          cd web/soberpal-web
          npm test
          
      - name: Build
        run: |
          cd web/soberpal-web
          npm run build
