name: 🌸 Women's Health Ecosystem CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20.10.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 🧪 Testing & Quality Assurance
  test:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        platform: [meno-tracker, meno-partner, meno-community]
        component: [mobile, backend]
        exclude:
          - platform: meno-partner
            component: mobile
          - platform: meno-partner
            component: backend
          - platform: meno-community
            component: mobile
          - platform: meno-community
            component: backend
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: 🔧 Install dependencies
      run: npm ci
      
    - name: 🧹 Lint code
      run: |
        if [ -d "platforms/${{ matrix.platform }}/${{ matrix.component }}" ]; then
          cd platforms/${{ matrix.platform }}/${{ matrix.component }}
          npm run lint || echo "Lint not configured"
        fi
        
    - name: 🧪 Run tests
      run: |
        if [ -d "platforms/${{ matrix.platform }}/${{ matrix.component }}" ]; then
          cd platforms/${{ matrix.platform }}/${{ matrix.component }}
          npm test || echo "Tests not configured"
        fi
        
    - name: 🔍 Type check
      run: |
        if [ -d "platforms/${{ matrix.platform }}/${{ matrix.component }}" ]; then
          cd platforms/${{ matrix.platform }}/${{ matrix.component }}
          npm run type-check || echo "Type check not configured"
        fi

  # 🏗️ Build Applications
  build:
    name: 🏗️ Build Applications
    runs-on: ubuntu-latest
    needs: test
    
    strategy:
      matrix:
        platform: [meno-tracker]
        component: [mobile, backend]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: 🔧 Install dependencies
      run: npm ci
      
    - name: 🏗️ Build application
      run: |
        cd platforms/${{ matrix.platform }}/${{ matrix.component }}
        npm run build || echo "Build not configured"
        
    - name: 📤 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform }}-${{ matrix.component }}-build
        path: platforms/${{ matrix.platform }}/${{ matrix.component }}/dist/
        retention-days: 7

  # 🔒 Security Scanning
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔍 Run security audit
      run: npm audit --audit-level=high
      
    - name: 🛡️ Run CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: javascript
        
    - name: 🔍 Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  # 🐳 Docker Build & Push
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        platform: [meno-tracker]
        component: [backend]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 🔐 Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 📝 Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.platform }}-${{ matrix.component }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
          
    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: platforms/${{ matrix.platform }}/${{ matrix.component }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 🚀 Deploy to Staging
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [security, docker]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🚀 Deploy to staging
      run: |
        echo "🌸 Deploying Women's Health Ecosystem to staging..."
        # Add your staging deployment commands here
        
    - name: 🧪 Run integration tests
      run: |
        echo "🧪 Running integration tests..."
        # Add your integration test commands here
        
    - name: 📊 Health check
      run: |
        echo "📊 Performing health checks..."
        # Add your health check commands here

  # 🌟 Deploy to Production
  deploy-production:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: [security, docker]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🌟 Deploy to production
      run: |
        echo "🌸 Deploying Women's Health Ecosystem to production..."
        echo "🎯 Serving 1 BILLION women globally!"
        # Add your production deployment commands here
        
    - name: 📊 Production health check
      run: |
        echo "📊 Performing production health checks..."
        # Add your production health check commands here
        
    - name: 📢 Notify deployment success
      run: |
        echo "🎉 Women's Health Ecosystem successfully deployed!"
        echo "🌸 Ready to transform menopause care worldwide!"
